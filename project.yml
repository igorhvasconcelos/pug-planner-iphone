name: PugPlanner
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  PugPlanner:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - Interface
      - path: App/Interface
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: AlarmKit.framework
        weak: true
    settings:
      base:
        PRODUCT_NAME: PugPlanner
        PRODUCT_BUNDLE_IDENTIFIER: com.luismartins.pugplanner.b7d839ce
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PugPlanner:
    build:
      targets:
        PugPlanner: all
    archive:
      config: Release
